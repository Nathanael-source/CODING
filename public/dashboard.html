<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>

<link
    rel="stylesheet"
    href="/css/styles.css"
>

</head>

<body class="bg-gray-950 text-white">

<header class="border-b border-gray-800">

<nav
    class="max-w-7xl mx-auto px-6 py-5 flex justify-between"
>

<a
    href="/"
    class="text-2xl font-bold"
>
    WebPlatform
</a>

<button
    id="logoutButton"
    class="btn-secondary"
>
    Logout
</button>

</nav>

</header>


<main
    class="max-w-7xl mx-auto px-6 py-16"
>

<h1 class="text-4xl font-bold">
    Dashboard
</h1>

<div
    id="userInfo"
    class="glass-card p-6 mt-8"
>
    Loading...
</div>


<div
    id="adminPanel"
    class="hidden mt-10"
>

<h2 class="text-3xl font-bold">
    Admin Panel
</h2>

<div
    id="users"
    class="mt-6"
>
</div>

</div>

</main>


<script src="/js/app.js"></script>
<script src="/js/dashboard.js"></script>

</body>

</html>
