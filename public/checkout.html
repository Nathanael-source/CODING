<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Checkout</title>

<script src="https://cdn.tailwindcss.com"></script>

<link
    rel="stylesheet"
    href="/css/styles.css"
>

</head>

<body class="bg-gray-950 text-white">

<header class="border-b border-gray-800">

<nav
    class="max-w-7xl mx-auto px-6 py-5"
>

<a
    href="/shop.html"
    class="text-2xl font-bold"
>
    ← Shop
</a>

</nav>

</header>


<main
    class="max-w-4xl mx-auto px-6 py-16"
>

<h1 class="text-4xl font-bold">
    Checkout
</h1>

<div
    id="checkoutList"
    class="mt-8"
>
    Loading...
</div>

<button
    id="checkoutButton"
    class="btn-primary mt-8 w-full"
>
    Buat Pesanan
</button>

<p
    id="checkoutResult"
    class="mt-5 text-center"
></p>

</main>


<script src="/js/app.js"></script>

<script>

async function loadCheckout() {

    const container =
        document.getElementById(
            "checkoutList"
        );

    const cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];

    if (cart.length === 0) {

        container.innerHTML =
            "<p>Keranjang kosong.</p>";

        return;
    }

    try {

        const data =
            await apiRequest(
                "/products"
            );

        let total = 0;

        container.innerHTML =
            cart.map(item => {

                const product =
                    data.products.find(
                        p =>
                            p.id ===
                            item.productId
                    );

                if (!product) {
                    return "";
                }

                const subtotal =
                    Number(product.price) *
                    item.quantity;

                total += subtotal;

                return `
                    <div
                        class="flex justify-between border-b border-gray-800 py-5"
                    >

                        <div>
                            <h2 class="font-bold">
                                ${escapeHTML(product.name)}
                            </h2>

                            <p class="text-gray-400">
                                ${item.quantity} ×
                                ${formatRupiah(product.price)}
                            </p>
                        </div>

                        <strong>
                            ${formatRupiah(subtotal)}
                        </strong>

                    </div>
                `;

            }).join("");

        container.innerHTML += `
            <div
                class="flex justify-between text-xl font-bold mt-8"
            >
                <span>Total</span>

                <span>
                    ${formatRupiah(total)}
                </span>
            </div>
        `;

    } catch (error) {

        container.textContent =
            error.message;
    }
}


document
    .getElementById(
        "checkoutButton"
    )
    .addEventListener(
        "click",
        async () => {

            const result =
                document.getElementById(
                    "checkoutResult"
                );

            const cart =
                JSON.parse(
                    localStorage.getItem(
                        "cart"
                    )
                ) || [];

            try {

                const data =
                    await apiRequest(
                        "/orders",
                        {
                            method: "POST",

                            body:
                                JSON.stringify({
                                    items: cart
                                })
                        }
                    );

                result.textContent =
                    `Pesanan #${data.orderId} berhasil dibuat.`;

                localStorage.removeItem(
                    "cart"
                );

            } catch (error) {

                result.textContent =
                    error.message;
            }
        }
    );


loadCheckout();

</script>

</body>

</html>
